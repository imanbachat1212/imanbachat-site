[build]
  publish = "."
  command = ""

# One official address: send www to the bare domain
[[redirects]]
  from = "https://www.imanbachat.com/*"
  to = "https://imanbachat.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'sha256-HnAEzfCnwQDTLB74R9KM701Ov+QjeH7kqwdDj7tReUE=' 'sha256-L6/3H3TcWWEsb7HISlzdW5+6Jz0fE5UtMGD57TxeXvo='; default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'sha256-HnAEzfCnwQDTLB74R9KM701Ov+QjeH7kqwdDj7tReUE=' 'sha256-L6/3H3TcWWEsb7HISlzdW5+6Jz0fE5UtMGD57TxeXvo='; default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

